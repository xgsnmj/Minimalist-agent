services:
  api:
    image: python:3.13-slim
    working_dir: /workspace
    command: bash scripts/dev-api.sh
    volumes:
      - ..:/workspace
    env_file:
      - ../.env.example
    environment:
      DATABASE_URL: postgresql+psycopg://minimalist_agent:minimalist_agent@postgres:5432/minimalist_agent
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
    ports:
      - "8000:8000"
    depends_on:
      - redis
      - postgres
      - minio

  worker:
    image: python:3.13-slim
    working_dir: /workspace
    command: bash scripts/dev-worker.sh
    volumes:
      - ..:/workspace
    env_file:
      - ../.env.example
    environment:
      DATABASE_URL: postgresql+psycopg://minimalist_agent:minimalist_agent@postgres:5432/minimalist_agent
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
    depends_on:
      - redis
      - postgres
      - minio

  web:
    image: node:24-slim
    working_dir: /workspace
    command: bash scripts/dev-web.sh
    volumes:
      - ..:/workspace
    env_file:
      - ../.env.example
    ports:
      - "5173:5173"
    depends_on:
      - api

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: minimalist_agent
      POSTGRES_USER: minimalist_agent
      POSTGRES_PASSWORD: minimalist_agent
    ports:
      - "5432:5432"

  minio:
    image: minio/minio:RELEASE.2026-06-13T11-33-47Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
